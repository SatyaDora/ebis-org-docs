site_name: ISSQUARED EBIS Training — Organization Module
site_description: Single-source training documentation for the EBIS Organization module
docs_dir: docs

theme:
  name: material
  palette:
    # Swap these two colors for official Issquared bran d colors before the demo
    primary: deep blue
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.view
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Accessing the Module: accessing-organization-module.md
  - Organization:
      - My Organizations: organization-my-organizations.md
      - Organizational Relationship: organization-organizational-relationship.md
      - My Locations: organization-my-locations.md
      - Contracts: organization-contracts.md
      - Contacts: organization-contacts.md
      - External Organizations: organization-external-organizations.md
      - External Locations: organization-external-locations.md
      - Intellectual Property: organization-intellectual-property.md
  - Administration:
      - General: organization-administration-general.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      zoomable: true
      draggable: true

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 2
