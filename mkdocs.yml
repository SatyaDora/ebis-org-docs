site_name: Ktech IBS Training — platform Module
site_description: Single-source training documentation for the EBIS platform module
docs_dir: docs

theme:
  name: material
  palette:
    # Swap these two colors for official Ktech brand colors before the demo
    primary: deep blue
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.view
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: accessing-platform-module.md
  - My platforms: platform-my-platforms.md
  - Relationships: platform-platformal-relationship.md
  - IP Records: platform-intellectual-property.md
  - Locations: platform-my-locations.md
  - Contracts: platform-contracts.md
  - External Orgs: platform-external-platforms.md
  - External Locations: platform-external-locations.md
  - Contacts: platform-contacts.md
  - Admin – General: platform-administration-general.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      zoomable: true
      draggable: true

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 2
