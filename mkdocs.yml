site_name: ISSQUARED EBIS Training — Organization Module
site_description: Single-source training documentation for the EBIS Organization module
docs_dir: docs

theme:
  name: material
  palette:
    # Swap these two colors for official Issquared brand colors before the demo
    primary: deep blue
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.action.view
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: accessing-organization-module.md
  - My Organizations: organization-my-organizations.md
  - Relationships: organization-organizational-relationship.md
  - IP Records: organization-intellectual-property.md
  - Locations: organization-my-locations.md
  - Contracts: organization-contracts.md
  - External Orgs: organization-external-organizations.md
  - External Locations: organization-external-locations.md
  - Contacts: organization-contacts.md
  - Admin – General: organization-administration-general.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      zoomable: true
      draggable: true

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 2
