name: Bug Report Form
description: File a structured bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we reach you?
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - v1.0
        - v2.0
    validations:
      required: true
